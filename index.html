    <meta charset="utf-8">
    <title>Penrose Window</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gl-matrix/2.6.1/gl-matrix-min.js"></script>
<script>

var tau = Math.PI*2

var D = 1*((new URL(document.location)).searchParams.get('d') ?? 5) // dimensions
var L = 31 // 15 lines
var G = 1*((new URL(document.location)).searchParams.get('g') ?? 0.1) // gap between lines
var off_x = 0
var off_y = 0


window.addEventListener('wheel', e => {

    console.log('blah: ' + `${e.deltaX} x ${e.deltaY}`)

    e.preventDefault()
    if (e.ctrlKey) {
        // Your zoom/scale factor
        let f = 1 - e.deltaY * 0.01
        G *= f
        off_x *= f
        off_y *= f
    } else {
        // // Your trackpad X and Y positions
        off_x += e.deltaX * 0.005
        off_y -= e.deltaY * 0.005
    }
    dirty = true
}, { passive: false })

var lastTouchDistance = 0
var lastTouchX = 0
var lastTouchY = 0
window.addEventListener("touchstart", (e) => {
    lastTouchX = e.touches[0].clientX
    lastTouchY = e.touches[0].clientY
}, false)
window.addEventListener("touchmove", (e) => {
    if (!(e.target.nodeName == 'CANVAS' && e.target.parentNode.nodeName == 'BODY')) return

    e.preventDefault()

    var deltaX = e.touches[0].clientX - lastTouchX
    var deltaY = e.touches[0].clientY - lastTouchY

    off_x -= deltaX * 0.005
    off_y += deltaY * 0.005
    dirty = true

    lastTouchX = e.touches[0].clientX
    lastTouchY = e.touches[0].clientY
}, { passive: false })

var old_D = null

var es, es_base
var program, program2
var u_G
var u_w
var u_h
var u_es
var u_es_base
var u_off_x
var u_off_y
var u_slider
var u_G2
var u_w2
var u_h2
var u_es2
var u_es_base2
var u_off_x2
var u_off_y2
var u_slider2
var in_a
var in_b
var in_c
var a_buf
var b_buf
var la_buf
var lb_buf
var c_buf
var a, a, la, lb
var cc
var vs, vs_lines, fs

let show_hud = (new URL(document.location)).searchParams.get('nohud') != null ? false : true
if (show_hud) {
    let d = document.createElement('div')
    d.style.position = 'absolute'
    d.style.left = '0px'
    d.style.top = '0px'
    d.style['z-index'] = 10000
    document.body.append(d)

    function make_b(text) {
        let c = document.createElement('canvas')
        let size = 64
        c.style.width = size + 'px'
        c.style.height = size + 'px'
        c.style.marginLeft = '5px'
        c.style.marginTop = '5px'
        c.width = size * window.devicePixelRatio
        c.height = size * window.devicePixelRatio
        draw_text(c, text)
        return c
    }

    function draw_text(c, text) {
        let g = c.getContext('2d')
        g.clearRect(0, 0, c.width, c.height)
        g.beginPath()
        g.arc(c.width/2, c.height/2, c.width/2, 0, tau)
        g.fillStyle = 'rgba(200, 200, 200, 0.75)'
        g.fill()

        var font_size = c.width*0.8
        while (true) {
            g.font = 'bold ' + font_size + 'px Arial'
            if (g.measureText(text).width > c.width*0.75) {
                font_size *= 0.8
            } else break
        }

        g.fillStyle = 'rgba(0, 0, 0, 1)'
        g.textAlign = 'center'
        g.textBaseline = 'middle'
        g.save()
        g.globalCompositeOperation = 'destination-out'
        g.fillText(text, c.width/2, c.height*55/100)
        g.restore()
        return c
    }

    let minus_b = make_b('-')
    minus_b.onclick = () => {
        if (D == 3) return
        D--
        draw_text(num_d, D)
        dirty = true
    }

    let num_d = make_b(`${D}`)

    let plus_b = make_b('+')
    plus_b.onclick = () => {
        D++
        draw_text(num_d, D)
        dirty = true
    }

    d.append(minus_b)
    d.append(num_d)
    d.append(plus_b)
}

var c = document.createElement('canvas')
c.style.position = 'absolute'
c.style.left = '0px'
c.style.top = '0px'
c.style.width = '100%'
c.style.height = '100%'
c.style['z-index'] = 1
document.body.append(c)

var gl = c.getContext('webgl')

function init_gl_stuff() {

    if (vs) gl.deleteShader(vs)
    vs = createShader(gl, gl.VERTEX_SHADER, `
    attribute vec4 in_a;
    attribute vec4 in_b;

    const float D = ${D.toFixed(1)};

    const float tau = 6.283185307179586;
    const float _90 = tau/4.0;

    uniform float u_G;
    uniform float u_w;
    uniform float u_h;
    uniform float u_es[${D}];
    uniform int u_es_base[${D}];
    uniform float u_colors[${Math.floor(D/2)*3*2}];
    uniform float u_off_x;
    uniform float u_off_y;
    uniform float u_slider;

    varying vec4 v;

    float round(float x) {
        if (fract(x) < 0.5) {
            return floor(x);
        } else {
            return floor(x) + 1.0;
        }
    }    

    vec2 get_intersection(float x1, float y1, float x2, float y2, float x3, float y3, float x4, float y4) {
        x2 += x1;
        y2 += y1;
        x4 += x3;
        y4 += y3;
        return vec2(
            ((x1*y2 - y1*x2)*(x3 - x4) - (x1 - x2)*(x3*y4 - y3*x4)) /
            ((x1 - x2)*(y3 - y4) - (y1 - y2)*(x3 - x4)),
            
            ((x1*y2 - y1*x2)*(y3 - y4) - (y1 - y2)*(x3*y4 - y3*x4)) /
            ((x1 - x2)*(y3 - y4) - (y1 - y2)*(x3 - x4))
        );
    }

    // https://stackoverflow.com/questions/4200224/random-noise-functions-for-glsl
    float rand(vec2 co) {
        return fract(sin(dot(co.xy ,vec2(12.9898,78.233))) * 43758.5453);
    }

    float get_e_ang(float e_i) {
        return _90 + e_i * tau / D;
    }

    void main() {
        vec2 o = vec2(0.0, 0.0);
        
        float ang1 = get_e_ang(in_a.x);
        vec2 unit = vec2(cos(ang1), sin(ang1));
        float len1 = (floor(dot(unit, o)/u_G) + u_es[int(in_a.x)])*u_G + in_a.y*u_G;
        
        float ang2 = get_e_ang(in_a.z);
        unit = vec2(cos(ang2), sin(ang2));
        float len2 = (floor(dot(unit, o)/u_G) + u_es[int(in_a.z)])*u_G + in_a.w*u_G;
        
        vec2 pos = get_intersection(
            cos(ang1)*len1, sin(ang1)*len1,
            cos(ang1 + _90), sin(ang1 + _90),
            cos(ang2)*len2, sin(ang2)*len2,
            cos(ang2 + _90), sin(ang2 + _90)
        );
        
        float e_scale = 2.0 * 1.0/D;
        
        vec2 goal = -o;
        int color_ref = 0;
        for (float i = 0.0; i < D; i += 1.0) {
            float ang = get_e_ang(i);
            vec2 unit = vec2(cos(ang), sin(ang));
            float units = dot(unit, pos)/u_G - u_es[int(i)];
            float ref_units = units;
            if (in_a.x == i) {
                units = round(units);
                ref_units = units;
                if (in_b.x == 0.0 || in_b.x == 1.0) {
                    units -= 1.0;
                }
            } else if (in_a.z == i) {
                units = round(units);
                ref_units = units;
                if (in_b.x == 1.0 || in_b.x == 2.0) {
                    units -= 1.0;
                }
            } else {
                units = floor(units);
                ref_units = units;
            }
            goal += unit * (units * u_G * e_scale);
            color_ref += u_es_base[int(i)] + int(ref_units);
        }
        
        vec2 nudge = vec2(u_off_x, u_off_y);
        goal += nudge;

        float r = rand(vec2(float(color_ref), mod(floor(in_b.x/2.0), 2.0)));

        int iD = int(D);
        int diff = int(round(mod(float(int(in_a.x) - int(in_a.z) + iD), float(iD))));
        if (diff > iD/2) diff = iD - diff;
        diff--;
        
        if (in_b.y == 1.0) {
            v = vec4(0.0, 0.0, 0.0, 1.0);
        } else {
            v = vec4(
                mix(u_colors[diff*6 + 0], u_colors[diff*6 + 3], r),
                mix(u_colors[diff*6 + 1], u_colors[diff*6 + 4], r),
                mix(u_colors[diff*6 + 2], u_colors[diff*6 + 5], r),
                u_slider);
        }

        vec2 p = pos - o;
        if (u_w > u_h) {
            gl_Position = mix(
                vec4(p.x, p.y * u_w / u_h, 0.0, 1.0),
                vec4(goal.x, goal.y * u_w / u_h, 0.0, 1.0), u_slider);
        } else {
            gl_Position = mix(
                vec4(p.x * u_h / u_w, p.y, 0.0, 1.0),
                vec4(goal.x * u_h / u_w, goal.y, 0.0, 1.0), u_slider);
        }
    }
    `)

    if (vs_lines) gl.deleteShader(vs_lines)
    vs_lines = createShader(gl, gl.VERTEX_SHADER, `
    attribute vec4 in_c;

    const float D = ${D.toFixed(1)};

    const float tau = 6.283185307179586;
    const float _90 = tau/4.0;

    uniform float u_G;
    uniform float u_w;
    uniform float u_h;
    uniform float u_es[${D}];
    uniform float u_off_x;
    uniform float u_off_y;
    uniform float u_slider;

    varying vec4 v;

    float get_e_ang(float e_i) {
        return _90 + e_i * tau / D;
    }

    void main() {
        vec2 o = vec2(0.0, 0.0);
        
        float ang = get_e_ang(in_c.x);
        vec2 unit = vec2(cos(ang), sin(ang));
        vec2 sideways = vec2(cos(ang + _90), sin(ang + _90));
        float len = (floor(dot(unit, o)/u_G) + u_es[int(in_c.x)])*u_G + in_c.y*u_G;
        
        vec2 goal = unit*len;
        
        goal += sideways*dot(sideways, o);
        
        if (in_c.z == 0.0) {
            goal += sideways*2.0;
        } else {
            goal -= sideways*2.0;
        }
        goal -= o;

        v = vec4(0.0, 0.0, 0.0, 1.0 - u_slider);
        
        if (u_w > u_h) {
            gl_Position = vec4(goal.x, goal.y * u_w / u_h, 0.0, 1.0);
        } else {
            gl_Position = vec4(goal.x * u_h / u_w, goal.y, 0.0, 1.0);
        }
    }
    `)

    if (fs) gl.deleteShader(fs)
    fs = createShader(gl, gl.FRAGMENT_SHADER, `
    precision mediump float;

    varying vec4 v;

    void main() {
        gl_FragColor = v; // mix(gl_Color, v, v.a);
    }

    `)

    a = []
    b = []
    for (var d1 = 0; d1 < D; d1++) {
        for (var d2 = d1 + 1; d2 < D; d2++) {
            for (var i = 0; i < L; i++) {
                for (var ii = 0; ii < L; ii++) {
                    //;[0, 1, 2, 0, 2, 3]
                    ;[0, 1, 3, 1, 2, 3].forEach(c => {
                        a.push(d1)
                        a.push(i - Math.floor(L/2))
                        a.push(d2)
                        a.push(ii - Math.floor(L/2))
                        
                        b.push(c)
                        b.push(0)
                        b.push(0)
                        b.push(0)
                    })
                }
            }
        }
    }

    la = []
    lb = []
    for (var d1 = 0; d1 < D; d1++) {
        for (var d2 = d1 + 1; d2 < D; d2++) {
            for (var i = 0; i < L; i++) {
                for (var ii = 0; ii < L; ii++) {
                    //;[0, 1, 2, 0, 2, 3]
                    ;[0, 1, 1, 2, 2, 3, 3, 0].forEach(c => {
                        la.push(d1)
                        la.push(i - Math.floor(L/2))
                        la.push(d2)
                        la.push(ii - Math.floor(L/2))
                        
                        lb.push(c)
                        lb.push(1)
                        lb.push(0)
                        lb.push(0)
                    })
                }
            }
        }
    }

    cc = []
    for (var d1 = 0; d1 < D; d1++) {
        for (var i = 0; i < L; i++) {
            ;[0, 1].forEach(c => {
                cc.push(d1)
                cc.push(i - Math.floor(L/2))
                cc.push(c)
                cc.push(0)
            })
        }
    }


    es = []
    es_base = []

    for (var d = 0; d < D; d++) {
        es.push(1/D)
        es_base.push(0)
    }

    if (program) gl.deleteProgram(program)
    program = createProgram(gl, vs, fs)
    gl.useProgram(program)

    u_G = gl.getUniformLocation(program, 'u_G')
    u_w = gl.getUniformLocation(program, 'u_w')
    u_h = gl.getUniformLocation(program, 'u_h')
    u_es = gl.getUniformLocation(program, 'u_es')
    u_es_base = gl.getUniformLocation(program, 'u_es_base')
    u_off_x = gl.getUniformLocation(program, 'u_off_x')
    u_off_y = gl.getUniformLocation(program, 'u_off_y')
    u_slider = gl.getUniformLocation(program, 'u_slider')
    u_colors = gl.getUniformLocation(program, 'u_colors')

    init_colors = () => {
        let color_data = []
        let color_count = Math.floor(D/2)
        let a = Math.random() * tau
        for (var i = 0; i < color_count; i++) {
            let r = Math.sin(a)/2 + 0.5
            let g = Math.sin(a + tau/3)/2 + 0.5
            let b = Math.sin(a - tau/3)/2 + 0.5
            a += tau/color_count
            // let r = Math.random()
            // let g = Math.random()
            // let b = Math.random()
            color_data.push(r)
            color_data.push(g)
            color_data.push(b)
            // color_data.push(Math.min(r + 0.1, 1))
            // color_data.push(Math.min(g + 0.1, 1))
            // color_data.push(Math.min(b + 0.1, 1))
            color_data.push(r)
            color_data.push(g)
            color_data.push(b)
        }
        
        gl.useProgram(program)
        gl.uniform1fv(u_colors, color_data)
    }
    init_colors()




    in_a = gl.getAttribLocation(program, 'in_a')
    in_b = gl.getAttribLocation(program, 'in_b')
    gl.enableVertexAttribArray(in_a)
    gl.enableVertexAttribArray(in_b)





    if (program2) gl.deleteProgram(program2)
    program2 = createProgram(gl, vs_lines, fs)
    gl.useProgram(program2)

    u_G2 = gl.getUniformLocation(program2, 'u_G')
    u_w2 = gl.getUniformLocation(program2, 'u_w')
    u_h2 = gl.getUniformLocation(program2, 'u_h')
    u_es2 = gl.getUniformLocation(program2, 'u_es')
    u_es_base2 = gl.getUniformLocation(program2, 'u_es_base')
    u_off_x2 = gl.getUniformLocation(program2, 'u_off_x')
    u_off_y2 = gl.getUniformLocation(program2, 'u_off_y')
    u_slider2 = gl.getUniformLocation(program2, 'u_slider')


    in_c = gl.getAttribLocation(program2, 'in_c')
    gl.enableVertexAttribArray(in_c)





    if (a_buf) gl.deleteBuffer(a_buf)
    a_buf = gl.createBuffer()
    gl.bindBuffer(gl.ARRAY_BUFFER, a_buf)
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(a), gl.STATIC_DRAW)

    if (b_buf) gl.deleteBuffer(b_buf)
    b_buf = gl.createBuffer()
    gl.bindBuffer(gl.ARRAY_BUFFER, b_buf)
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(b), gl.STATIC_DRAW)


    if (la_buf) gl.deleteBuffer(la_buf)
    la_buf = gl.createBuffer()
    gl.bindBuffer(gl.ARRAY_BUFFER, la_buf)
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(la), gl.STATIC_DRAW)

    if (lb_buf) gl.deleteBuffer(lb_buf)
    lb_buf = gl.createBuffer()
    gl.bindBuffer(gl.ARRAY_BUFFER, lb_buf)
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(lb), gl.STATIC_DRAW)



    if (c_buf) gl.deleteBuffer(c_buf)
    c_buf = gl.createBuffer()
    gl.bindBuffer(gl.ARRAY_BUFFER, c_buf)
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(cc), gl.STATIC_DRAW)
}

function create_slider(left) {
    var slider_input = document.createElement('input')
    slider_input.setAttribute('id', 'slider')
    slider_input.setAttribute('type', 'range')
    slider_input.setAttribute('min', '0')
    slider_input.setAttribute('max', '1000')
    slider_input.setAttribute('value', '1000')
    slider_input.style.position = 'absolute'
    slider_input.style.left = left
    slider_input.style.width = 'calc(50% - 10px)'
    slider_input.style.bottom = '0px'
    slider_input.style.height = slider_size_px + 'px'
    document.body.append(slider_input)
    slider_input.style['z-index'] = 2000

    slider_input.oninput = () => dirty = true

    return slider_input
}

gl.enable(gl.BLEND)
gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA)

let set_s2_already = false

var dirty = true
loop()
function loop() {
    
    if (c.width != c.offsetWidth * window.devicePixelRatio ||
        c.height != c.offsetHeight * window.devicePixelRatio) {
        c.width = c.offsetWidth * window.devicePixelRatio
        c.height = c.offsetHeight * window.devicePixelRatio
        dirty = true
    }

    if (D != old_D) {
        console.log('hey!?-- redoing D')
        old_D = D
        init_gl_stuff()
        slider_input2.value = 1/D * 1000

        if (!set_s2_already) {
            set_s2_already = true
            slider_input2.value = 1*((new URL(document.location)).searchParams.get('s2') ?? slider_input2.value)
        }
    }

    if (dirty) {
        dirty = false
        
        var slider_amt = slider_input.value / 1000
        var slider_amt2 = slider_input2.value / 1000

        gl.viewport(0, 0, c.width, c.height)
        gl.bindFramebuffer(gl.FRAMEBUFFER, null)
        
        
        var es = []
        for (var d = 0; d < D; d++) {
            es.push(slider_amt2)
        }

        // work here
        var fake_es = []
        for (var i = 0; i < D; i++) {
            var ang = tau/4 + i*tau/D
            var unit = vec2.fromValues(Math.cos(ang), Math.sin(ang))
            var o = vec2.fromValues(off_x, off_y)
            var d = -(vec2.dot(unit, o)/G - es[i]) % 1
            if (d < 0) d += 1
            fake_es.push(d)
        }

        var e_scale = 2/D
        var fake_off = vec2.fromValues(-off_x, -off_y)
        var fake_es_base = []
        for (var i = 0; i < D; i++) {
            var ang = tau/4 + i*tau/D
            var unit = vec2.fromValues(Math.cos(ang), Math.sin(ang))
            var o = vec2.fromValues(off_x, off_y)
            var units = Math.ceil(vec2.dot(unit, o)/G - es[i])
            
            fake_es_base.push(units)
            
            vec2.add(fake_off, fake_off, vec2.scale(unit, unit, units * G * e_scale))
        }

        gl.useProgram(program2)

        gl.vertexAttribPointer(in_a, 4, gl.FLOAT, false, 0, 0)
        
        // work here
        gl.uniform1fv(u_es2, fake_es)
        gl.uniform1iv(u_es_base2, fake_es_base)
        // gl.uniform1fv(u_es2, es)
        
        // work here
        gl.uniform1f(u_off_x2, fake_off[0])
        gl.uniform1f(u_off_y2, fake_off[1])
        // gl.uniform1f(u_off_x2, off_x)
        // gl.uniform1f(u_off_y2, off_y)
        
        gl.uniform1f(u_G2, G)
        gl.uniform1f(u_w2, c.width)
        gl.uniform1f(u_h2, c.height)
        gl.uniform1f(u_slider2, slider_amt)

        gl.bindBuffer(gl.ARRAY_BUFFER, c_buf)
        gl.vertexAttribPointer(in_c, 4, gl.FLOAT, false, 0, 0)

        gl.drawArrays(gl.LINES, 0, cc.length / 4)
        
        
        
        
        gl.useProgram(program)
        
        // work here
        gl.uniform1fv(u_es, fake_es)
        gl.uniform1iv(u_es_base, fake_es_base)
        // gl.uniform1fv(u_es, es)
        
        // work here
        gl.uniform1f(u_off_x, fake_off[0])
        gl.uniform1f(u_off_y, fake_off[1])
        // gl.uniform1f(u_off_x, off_x)
        // gl.uniform1f(u_off_y, off_y)
        
        gl.uniform1f(u_G, G)
        gl.uniform1f(u_w, c.width)
        gl.uniform1f(u_h, c.height)
        gl.uniform1f(u_slider, slider_amt)
        
        gl.bindBuffer(gl.ARRAY_BUFFER, a_buf)
        gl.vertexAttribPointer(in_a, 4, gl.FLOAT, false, 0, 0)
        
        gl.bindBuffer(gl.ARRAY_BUFFER, b_buf)
        gl.vertexAttribPointer(in_b, 4, gl.FLOAT, false, 0, 0)
        
        gl.drawArrays(gl.TRIANGLES, 0, a.length / 4)
        
        
        
        gl.bindBuffer(gl.ARRAY_BUFFER, la_buf)
        gl.vertexAttribPointer(in_a, 4, gl.FLOAT, false, 0, 0)
        
        gl.bindBuffer(gl.ARRAY_BUFFER, lb_buf)
        gl.vertexAttribPointer(in_b, 4, gl.FLOAT, false, 0, 0)
        
        gl.drawArrays(gl.LINES, 0, la.length / 4)
    }
    
    window.requestAnimationFrame(loop)
}

function createShader(gl, type, source) {
    var shader = gl.createShader(type)
    gl.shaderSource(shader, source)
    gl.compileShader(shader)
    if (gl.getShaderParameter(shader, gl.COMPILE_STATUS)) return shader
    console.log(gl.getShaderInfoLog(shader))
    gl.deleteShader(shader)
}

function createProgram(gl, vertexShader, fragmentShader) {
    var program = gl.createProgram()
    gl.attachShader(program, vertexShader)
    gl.attachShader(program, fragmentShader)
    gl.linkProgram(program)
    if (gl.getProgramParameter(program, gl.LINK_STATUS)) return program
    console.log(gl.getProgramInfoLog(program))
    gl.deleteProgram(program)
}

function lerp(t0, v0, t1, v1, t) {
    return (t - t0) * (v1 - v0) / (t1 - t0) + v0
}
